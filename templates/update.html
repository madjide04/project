{% extends 'base.html' %}

{% block head%}
{% endblock %}

{% block body%}
<div class="content">
    <h1>Welcome to our Chess Game : {% if name %} {{ name }} {% endif %}</h1>
    
    <div class="button">
        <form action="/game" method="POSt">
            <label for="spinner">Select a value:</label>
            <select id="spinner" name="selected_value">
                <option value="player">a player</option>
                <option value="chess_bot">an ai bot</option>
            </select>
            <input type="submit" value="Start">
        </form>
    </div>
    
</div>
{% endblock %}
